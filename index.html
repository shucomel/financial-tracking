<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monarch - Dashboard Utama</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        /* Latar belakang bertukar ke putih/pink cair */
        body { display: flex; background-color: #fff5f8; color: #2d1222; min-height: 100vh; }
        
        /* Sidebar - Tema Putih & Pink */
        .sidebar { width: 260px; background-color: #ffffff; padding: 24px 16px; display: flex; flex-direction: column; gap: 30px; border-right: 1px solid #fbcfe8; position: fixed; height: 100vh; z-index: 10; }
        .logo-container { display: flex; align-items: center; gap: 12px; padding-left: 8px; }
        .logo-box { background-color: #db2777; color: white; font-weight: bold; font-size: 20px; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border-radius: 8px; }
        .logo-text { font-size: 22px; font-weight: 700; letter-spacing: 0.5px; color: #db2777; text-transform: uppercase; }
        .nav-menu { display: flex; flex-direction: column; gap: 8px; list-style: none; }
        .nav-item { display: flex; align-items: center; gap: 16px; padding: 14px 16px; color: #be185d; text-decoration: none; font-size: 16px; font-weight: 500; border-radius: 12px; cursor: pointer; transition: all 0.2s ease; }
        .nav-item:hover { color: #db2777; background-color: #fff1f6; }
        .nav-item.active { color: #ffffff; background-color: #db2777; }

        /* Main Content */
        .main-content { margin-left: 260px; padding: 40px; width: calc(100% - 260px); display: flex; flex-direction: column; gap: 30px; }
        
        /* Header Syarikat - Kad Putih & Border Pink */
        .company-header { display: flex; justify-content: space-between; align-items: center; background: #ffffff; padding: 24px; border-radius: 12px; border: 1px solid #fbcfe8; box-shadow: 0 4px 6px -1px rgba(219, 39, 119, 0.05); }
        .company-info { display: flex; align-items: center; gap: 16px; }
        .company-logo { background-color: #db2777; color: white; width: 50px; height: 50px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: bold; }
        .company-name { font-size: 24px; font-weight: 700; color: #2d1222; }
        .report-status { font-size: 14px; color: #be185d; margin-top: 4px; }
        .header-actions { display: flex; align-items: center; gap: 14px; }

        /* Buttons */
        .btn-new-tx { background-color: #db2777; color: white; border: none; padding: 12px 20px; font-weight: 600; border-radius: 8px; cursor: pointer; transition: background 0.2s; font-size: 14px; }
        .btn-new-tx:hover { background-color: #be185d; }
        .btn-view-report { background-color: transparent; color: #db2777; border: 1px solid #db2777; padding: 12px 20px; font-weight: 600; border-radius: 8px; cursor: pointer; transition: all 0.2s; text-decoration: none; font-size: 14px; display: inline-block; }
        .btn-view-report:hover { background-color: #db2777; color: white; }

        /* Ringkasan Prestasi & Carta Atas */
        .performance-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 24px; }
        .summary-panel { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
        .metric-card { background-color: #ffffff; border: 1px solid #fbcfe8; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; justify-content: center; box-shadow: 0 4px 6px -1px rgba(219, 39, 119, 0.05); }
        .metric-title { font-size: 13px; color: #be185d; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
        .metric-value { font-size: 22px; font-weight: 700; }

        /* Mini Chart Card */
        .mini-chart-card { background-color: #ffffff; border: 1px solid #fbcfe8; border-radius: 12px; padding: 16px; text-align: center; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 4px 6px -1px rgba(219, 39, 119, 0.05); }
        .mini-chart-title { font-size: 13px; color: #be185d; font-weight: 600; }
        .chart-box { display: flex; justify-content: center; align-items: flex-end; gap: 20px; height: 90px; border-bottom: 2px solid #fbcfe8; padding-bottom: 4px; margin: 10px 0; }
        .bar { width: 35px; border-radius: 4px 4px 0 0; transition: height 0.3s; }
        .bar-income { background-color: #10b981; }
        .bar-expense { background-color: #f43f5e; }
        .bar-label { font-size: 10px; color: #be185d; margin-top: 4px; }

        /* Lower Layout (Table Area) */
        .data-panel { background-color: #ffffff; border: 1px solid #fbcfe8; border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px -1px rgba(219, 39, 119, 0.05); }
        .filter-bar { display: flex; gap: 12px; margin-bottom: 20px; }
        .search-input, .filter-select { padding: 10px 14px; background-color: #fff5f8; border: 1px solid #fbcfe8; color: #2d1222; border-radius: 8px; outline: none; }
        .search-input::placeholder { color: #f472b6; }
        .search-input { flex: 1; }

        /* Table */
        table { width: 100%; border-collapse: collapse; }
        th { padding: 12px 16px; color: #db2777; font-size: 14px; border-bottom: 1px solid #fbcfe8; text-align: left; }
        td { padding: 14px 16px; font-size: 14px; border-bottom: 1px solid #fff5f8; color: #2d1222; }
        
        /* Badges */
        .badge-cat { padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .cat-food { background-color: rgba(234, 88, 12, 0.15); color: #ea580c; }
        .cat-salary { background-color: rgba(22, 163, 74, 0.15); color: #16a34a; }
        .cat-transport { background-color: rgba(14, 165, 233, 0.15); color: #0ea5e9; }
        .cat-utilities { background-color: rgba(219, 39, 119, 0.15); color: #db2777; }
        
        .action-btns { display: flex; gap: 6px; }
